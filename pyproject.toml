[project]
name = "paracite"
version = "0.1.0"
description = "SaaS API-first de citas jurídicas de precisión (España, MVP)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ParaCite" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.2",
    "redis>=5.2.0",
    "pyyaml>=6.0.2",
    "psycopg[binary]>=3.2.0",
]

[tool.hatch.build.targets.wheel.force-include]
"src/paracite/corpus/seed.json" = "paracite/corpus/seed.json"
"src/paracite/corpus/co-piloto.json" = "paracite/corpus/co-piloto.json"
"src/paracite/static/index.html" = "paracite/static/index.html"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
paracite = "paracite.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paracite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
